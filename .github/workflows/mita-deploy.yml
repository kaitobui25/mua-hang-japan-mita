name: Mita Japan tagged-message release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact committed HEAD selected by One-Click
        required: true
        type: string
      request_id:
        description: Unique One-Click request identifier
        required: true
        type: string

run-name: Mita One-Click ${{ inputs.request_id || github.sha }}

permissions:
  contents: read

concurrency:
  group: mita-production
  cancel-in-progress: false

jobs:
  release:
    # An explicit One-Click dispatch can only deploy its pinned branch HEAD.
    # Ordinary pushes still require the existing [deploy] marker.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_sha == github.sha && inputs.request_id != '') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5433/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Start isolated PostgreSQL on its actual port 5433
        run: |
          docker run -d --name mita-ci-postgres --network host \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=ci-only-password \
            -e POSTGRES_DB=postgres \
            postgres:16 -c port=5433 -c listen_addresses=127.0.0.1
          for attempt in {1..40}; do
            if docker exec mita-ci-postgres pg_isready -h 127.0.0.1 -p 5433 -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs --tail 30 mita-ci-postgres
          exit 1
      - name: Build and test immutable production artifact
        run: bash deploy/mita/build-ci-release.sh
      - name: Retain release for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mita-${{ github.sha }}
          path: |
            .verification/mita-artifacts/*-mita-linux-x64.tar.gz
            .verification/mita-artifacts/*-mita-linux-x64.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Deploy exactly this commit to Hermes
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_sha == github.sha && inputs.request_id != '')
        env:
          DEPLOY_KEY: ${{ secrets.MITA_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.MITA_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.MITA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/mita_ci_key")
          chmod 600 "$HOME/.ssh/mita_ci_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/mita_ci_key" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "ubuntu@$DEPLOY_HOST" "deploy $RELEASE_ID $RELEASE_SHA256" < "$RELEASE_BUNDLE"
      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/mita_ci_key" "$HOME/.ssh/known_hosts"
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker rm -f mita-ci-postgres >/dev/null 2>&1 || true
