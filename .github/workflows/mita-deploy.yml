name: Mita Japan tagged-message release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mita-production
  cancel-in-progress: false

jobs:
  release:
    # Only the HEAD commit of a push to main may authorize deployment.
    # Manual dispatch is a build-only diagnostic; it NEVER uploads to Hermes.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
      PUBLIC_READ_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Build and test immutable production artifact
        run: bash deploy/mita/build-ci-release.sh
      - name: Retain release for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mita-${{ github.sha }}
          path: |
            .verification/mita-artifacts/*-mita-linux-x64.tar.gz
            .verification/mita-artifacts/*-mita-linux-x64.tar.gz.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Deploy exactly this commit to Hermes
        if: github.event_name == 'push'
        env:
          DEPLOY_KEY: ${{ secrets.MITA_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.MITA_DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.MITA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/mita_ci_key")
          chmod 600 "$HOME/.ssh/mita_ci_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/mita_ci_key" -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o BatchMode=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "ubuntu@$DEPLOY_HOST" "deploy $RELEASE_ID $RELEASE_SHA256" < "$RELEASE_BUNDLE"
      - name: Remove temporary SSH material
        if: always()
        run: rm -f "$HOME/.ssh/mita_ci_key" "$HOME/.ssh/known_hosts"
